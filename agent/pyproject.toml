[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-assistant-agent"
version = "0.2.0"
description = "Disaggregated voice pipeline — independent STT, LLM, and TTS services via LiveKit agents"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[openai]~=1.5",
    "livekit-plugins-silero~=1.0",
    "python-dotenv",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]
