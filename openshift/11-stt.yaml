apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt
  namespace: voice-pipeline
  labels:
    app.kubernetes.io/name: stt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stt
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-l40s-1.bmas-001.lab.rdu2.dc.redhat.com
      containers:
        - name: faster-whisper
          image: fedirz/faster-whisper-server:0.5-cpu
          env:
            - name: WHISPER__MODEL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: STT_ACTIVE_MODEL
            - name: WHISPER__COMPUTE_TYPE
              value: int8
            - name: WHISPER__MODEL_TTL
              value: "-1"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stt-server
  namespace: voice-pipeline
spec:
  selector:
    app.kubernetes.io/name: stt
  ports:
    - name: http
      port: 8001
      targetPort: 8000
