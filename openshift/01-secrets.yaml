apiVersion: v1
kind: Secret
metadata:
  name: livekit-credentials
  namespace: shwalsh
type: Opaque
stringData:
  LIVEKIT_API_KEY: <your-livekit-api-key>
  LIVEKIT_API_SECRET: <your-livekit-api-secret>
---
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: shwalsh
type: Opaque
stringData:
  HF_TOKEN: <your-huggingface-token>
