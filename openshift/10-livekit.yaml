apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: voice-pipeline
  labels:
    app.kubernetes.io/name: livekit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: livekit
          image: livekit/livekit-server:latest
          args: ["--config", "/etc/livekit/config.yaml"]
          ports:
            - containerPort: 7880
              name: http
            - containerPort: 7881
              name: rtc
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: livekit-config
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-server
  namespace: voice-pipeline
spec:
  selector:
    app.kubernetes.io/name: livekit
  ports:
    - name: http
      port: 7880
      targetPort: 7880
    - name: rtc
      port: 7881
      targetPort: 7881
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: livekit
  namespace: voice-pipeline
  annotations:
    haproxy.router.openshift.io/timeout: "3600s"
spec:
  # host: livekit-<namespace>.apps.<cluster-domain>
  to:
    kind: Service
    name: livekit-server
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
