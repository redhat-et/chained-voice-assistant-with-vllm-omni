apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: shwalsh
  labels:
    app.kubernetes.io/name: llm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          command: ["vllm", "serve"]
          args:
            - google/gemma-3-4b-it
            - --host
            - "0.0.0.0"
            - --port
            - "8002"
          env:
            - name: HOME
              value: /tmp
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
          ports:
            - containerPort: 8002
              name: http
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      securityContext:
        runAsUser: 0
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-server
  namespace: shwalsh
spec:
  selector:
    app.kubernetes.io/name: llm
  ports:
    - name: http
      port: 8002
      targetPort: 8002
