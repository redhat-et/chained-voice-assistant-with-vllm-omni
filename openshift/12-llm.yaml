apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: voice-pipeline
  labels:
    app.kubernetes.io/name: llm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-l40s-1.bmas-001.lab.rdu2.dc.redhat.com
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          command: ["vllm", "serve"]
          args:
            - "$(LLM_ACTIVE_MODEL)"
            - --host
            - "0.0.0.0"
            - --port
            - "8002"
            - --gpu-memory-utilization
            - "$(LLM_GPU_UTIL)"
            - --max-model-len
            - "2048"
            - --enforce-eager
            - --chat-template
            - /etc/chat-template/gemma-chat-template.jinja
            - --enable-auto-tool-choice
            - --tool-call-parser
            - hermes
          env:
            - name: LLM_ACTIVE_MODEL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: LLM_ACTIVE_MODEL
            - name: LLM_GPU_UTIL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: LLM_GPU_UTIL
            - name: HOME
              value: /tmp
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
          ports:
            - containerPort: 8002
              name: http
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: chat-template
              mountPath: /etc/chat-template
      securityContext:
        runAsUser: 0
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        - name: chat-template
          configMap:
            name: gemma-chat-template
---
apiVersion: v1
kind: Service
metadata:
  name: llm-server
  namespace: voice-pipeline
spec:
  selector:
    app.kubernetes.io/name: llm
  ports:
    - name: http
      port: 8002
      targetPort: 8002
