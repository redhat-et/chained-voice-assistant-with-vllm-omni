apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-manager
  namespace: voice-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-manager
  namespace: voice-pipeline
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-manager
  namespace: voice-pipeline
subjects:
  - kind: ServiceAccount
    name: model-manager
roleRef:
  kind: Role
  name: model-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-manager
  namespace: voice-pipeline
  labels:
    app.kubernetes.io/name: model-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-manager
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-l40s-1.bmas-001.lab.rdu2.dc.redhat.com
      serviceAccountName: model-manager
      containers:
        - name: model-manager
          image: quay.io/redhat-et/voice-pipeline-model-manager:latest
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 8006
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: model-manager
  namespace: voice-pipeline
spec:
  selector:
    app.kubernetes.io/name: model-manager
  ports:
    - name: http
      port: 8006
      targetPort: 8006
