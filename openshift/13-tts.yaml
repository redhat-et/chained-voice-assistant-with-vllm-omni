apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts
  namespace: voice-pipeline
  labels:
    app.kubernetes.io/name: tts
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tts
    spec:
      nodeSelector:
        kubernetes.io/hostname: dell-l40s-1.bmas-001.lab.rdu2.dc.redhat.com
      containers:
        - name: vllm-omni
          image: quay.io/vllm/automation-vllm-omni:cuda-28466746130
          command: ["vllm", "serve"]
          args:
            - "$(TTS_ACTIVE_MODEL)"
            - --omni
            - --host
            - "0.0.0.0"
            - --port
            - "8003"
            - --trust-remote-code
            - --gpu-memory-utilization
            - "$(TTS_GPU_UTIL)"
          env:
            - name: TTS_ACTIVE_MODEL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: TTS_ACTIVE_MODEL
            - name: TTS_GPU_UTIL
              valueFrom:
                configMapKeyRef:
                  name: model-config
                  key: TTS_GPU_UTIL
            - name: HOME
              value: /tmp
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
          ports:
            - containerPort: 8003
              name: http
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      securityContext:
        runAsUser: 0
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tts-server
  namespace: voice-pipeline
spec:
  selector:
    app.kubernetes.io/name: tts
  ports:
    - name: http
      port: 8003
      targetPort: 8003
