apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts
  namespace: voice-pipeline
  labels:
    app.kubernetes.io/name: tts
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tts
    spec:
      containers:
        - name: vllm-omni
          image: vllm/vllm-omni:v0.24.0
          command: ["vllm", "serve"]
          args:
            - Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
            - --omni
            - --host
            - "0.0.0.0"
            - --port
            - "8003"
            - --trust-remote-code
          env:
            - name: HOME
              value: /tmp
          ports:
            - containerPort: 8003
              name: http
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      securityContext:
        runAsUser: 0
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tts-server
  namespace: voice-pipeline
spec:
  selector:
    app.kubernetes.io/name: tts
  ports:
    - name: http
      port: 8003
      targetPort: 8003
